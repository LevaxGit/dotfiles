#
# Config by Claude · Intel GPU · Minimal & Clean · Windows-style binds
# ─────────────────────────────────────────────────────────────────────


# ╔══════════════════════════════════════╗
# ║           MONITOR & ENV              ║
# ╚══════════════════════════════════════╝

monitor = ,preferred,auto,1

# Intel GPU environment variables
env = LIBVA_DRIVER_NAME,iHD
env = WLR_DRM_DEVICES,/dev/dri/card0
env = __GLX_VENDOR_LIBRARY_NAME,mesa
env = VDPAU_DRIVER,va_gl

# Wayland/XDG
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Qt / GTK / Cursor
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = CLUTTER_BACKEND,wayland
env = MOZ_ENABLE_WAYLAND,1
# Custom Cursor
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Vimix-cursors


# ╔══════════════════════════════════════╗
# ║              AUTOSTART               ║
# ╚══════════════════════════════════════╝

exec-once = waybar
exec-once = awww-daemon
exec-once = swaync
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = hypridle
exec-once = swayosd-server


# ╔══════════════════════════════════════╗
# ║            GENERAL LOOK              ║
# ╚══════════════════════════════════════╝

general {
    gaps_in           = 5
    gaps_out          = 10
    border_size       = 1

    col.active_border   = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(313244aa)

    layout            = dwindle
    resize_on_border  = true
    allow_tearing     = false
}


# ╔══════════════════════════════════════╗
# ║           DECORATION / BLUR          ║
# ╚══════════════════════════════════════╝

decoration {
    rounding = 10

    active_opacity   = 1.0
    inactive_opacity = 0.92
    fullscreen_opacity = 1.0

    shadow {
        enabled      = true
        range        = 20
        render_power = 3
        color        = rgba(1a1a2ecc)
        color_inactive = rgba(1a1a2e66)
    }

    blur {
        enabled          = true
        size             = 8
        passes           = 3
        new_optimizations = true
        xray             = false
        noise            = 0.02
        contrast         = 0.9
        brightness       = 0.85
        vibrancy         = 0.2
        vibrancy_darkness = 0.0
        special          = false
        popups           = true
    }
}


# ╔══════════════════════════════════════╗
# ║             ANIMATIONS               ║
# ╚══════════════════════════════════════╝

animations {
    enabled = true

    # Custom bezier curves
    bezier = wind,      0.05, 0.9, 0.1, 1.05
    bezier = winIn,     0.1, 1.1, 0.1, 1.1
    bezier = winOut,    0.3, -0.3, 0, 1
    bezier = liner,     1, 1, 1, 1
    bezier = smooth,    0.25, 1, 0.5, 1
    bezier = overshot,  0.05, 0.9, 0.1, 1.1

    # Window animations
    animation = windows,     1, 5,  wind,   slide
    animation = windowsIn,   1, 5,  winIn,  slide
    animation = windowsOut,  1, 4,  winOut, slide
    animation = windowsMove, 1, 5,  wind,   slide

    # Border glow pulse
    animation = border,      1, 10, liner

    # Fade
    animation = fade,        1, 5,  smooth
    animation = fadeIn,      1, 5,  smooth
    animation = fadeOut,     1, 5,  smooth
    animation = fadeDim,     1, 5,  smooth

    # Workspaces — clean slide
    animation = workspaces,  1, 5,  smooth, slide
    animation = specialWorkspace, 1, 4, smooth, slidevert
}


# ╔══════════════════════════════════════╗
# ║              LAYOUTS                 ║
# ╚══════════════════════════════════════╝

dwindle {
    preserve_split     = true
    smart_resizing     = true
}

master {
    new_status  = master
    mfact       = 0.5
}


# ╔══════════════════════════════════════╗
# ║               INPUT                  ║
# ╚══════════════════════════════════════╝

input {
    kb_layout    = us,ru
    kb_options   = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity  = 0.75
    accel_profile = flat

    touchpad {
        natural_scroll          = true 
        middle_button_emulation = 1
        clickfinger_behavior    = 1
        tap-to-click            = true
        drag_lock               = false
        disable_while_typing    = true
    }
}

# gestures block removed — swipe options moved into input:touchpad in newer Hyprland


# ╔══════════════════════════════════════╗
# ║               MISC                   ║
# ╚══════════════════════════════════════╝

misc {
    force_default_wallpaper  = 0
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    enable_swallow           = true
    swallow_regex            = ^(kitty|foot|Alacritty)$
    focus_on_activate        = false
}

cursor {
    no_hardware_cursors = false
}



# ╔══════════════════════════════════════╗
# ║        WINDOW RULES                  ║
# ╚══════════════════════════════════════╝

# Float small/utility windows
windowrule = match:class ^(pavucontrol)$, float on
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(xdg-desktop-portal-gtk)$, float on
windowrule = match:class ^(file-roller)$, float on
windowrule = match:class ^(org.kde.polkit-kde-authentication-agent-1)$, float on

# Picture-in-Picture
windowrule = match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$, float on
windowrule = match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$, keep_aspect_ratio on
windowrule = match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$, move (monitor_w*.73) (monitor_h*.72)
windowrule = match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$, size (monitor_w*.25) (monitor_h*.25)
windowrule = match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$, float on
windowrule = match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$, pin on

# Opacity rules
windowrule = match:class ^(kitty)$, opacity 0.90
windowrule = match:class ^(foot)$, opacity 0.95


# ╔══════════════════════════════════════╗
# ║     KEYBINDS — Windows-style         ║
# ╚══════════════════════════════════════╝

$mod      = SUPER
$terminal = kitty
$browser  = zen-browser
$files    = nautilus
$menu     = rofi -show drun -theme ~/.config/rofi/theme.rasi

# ── Core ──────────────────────────────
bind = $mod, Return,      exec, $terminal
bind = $mod, E,           exec, $files
bind = $mod, B,           exec, $browser
bind = SUPER, D,    exec, $menu || pkill -9 rofi
bind = $mod, L,           exec, hyprlock

# Close window (Alt+F4 style)
#bind = ALT,  F4,          killactive
bind = $mod, Q,           killactive

# Exit / reload (Ctrl+Alt+Del vibes)
bind = $mod SHIFT, E,     exit
bind = $mod SHIFT, R,     exec, hyprctl reload

# Screenshot (like Win+Shift+S)
bind = Super+Shift, S, exec, ~/.config/hypr/scripts/screenshot.sh area
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh screen
bind = Super+Shift, Print, exec, ~/.config/hypr/scripts/screenshot.sh window

# Clipboard history
bind = $mod, V,           exec, cliphist list | rofi -dmenu -theme ~/.config/rofi/theme.rasi | cliphist decode | wl-copy

# ── Focus (arrow keys) ────────────────
bind = $mod, left,        movefocus, l
bind = $mod, right,       movefocus, r
bind = $mod, up,          movefocus, u
bind = $mod, down,        movefocus, d

# ── Move windows ──────────────────────
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# ── Resize (like Windows snap assist) ─
binde = $mod CTRL, right, resizeactive,  30 0
binde = $mod CTRL, left,  resizeactive, -30 0
binde = $mod CTRL, up,    resizeactive,  0 -30
binde = $mod CTRL, down,  resizeactive,  0  30

# ── Workspaces (Win+1-9 just like Windows virtual desktops) ──
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move window to workspace (Win+Shift+1-9)
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Scroll to switch workspaces
bind  = $mod, mouse_down, workspace, e+1
bind  = $mod, mouse_up,   workspace, e-1

# ── Window snapping (Win+Left/Right like Windows snap) ──
bind = $mod CTRL, left,   exec, hyprctl dispatch layoutmsg preselect l
bind = $mod, left,        exec, true    # handled above; snap via pseudotile below

# Maximize toggle (Win+Up)
bind = $mod, up,          fullscreen, 0
bind = $mod, F,           fullscreen, 0
bind = $mod SHIFT, F,     fullscreen, 1

# Float toggle (like right-click restore)
bind = $mod, Space,       togglefloating
bind = $mod, P,           pseudo

# Pin window on top
bind = $mod ALT, P,       pin

# ── Mouse ─────────────────────────────
bindm = $mod, mouse:272,  movewindow
bindm = $mod, mouse:273,  resizewindow

# ── Volume / brightness ───────────────
bindel = ,XF86AudioRaiseVolume,  exec, swayosd-client --output-volume raise
bindel = ,XF86AudioLowerVolume,  exec, swayosd-client --output-volume lower
bindl  = ,XF86AudioMute,         exec, swayosd-client --output-volume mute-toggle
bindl  = ,XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp,   exec, swayosd-client --brightness raise
bindel = ,XF86MonBrightnessDown, exec, swayosd-client --brightness lower
bindl  = ,Caps_Lock,             exec, swayosd-client --caps-lock

# Media keys
bindl = ,XF86AudioPlay,  exec, playerctl play-pause
bindl = ,XF86AudioNext,  exec, playerctl next
bindl = ,XF86AudioPrev,  exec, playerctl previous

# ── Notification center ────────────────
bind = $mod, A, exec, swaync-client -t

# ── Special workspace (scratchpad) ────
bind = $mod , S,       togglespecialworkspace, magic
bind = $mod ALT, S, movetoworkspacesilent,  special:magic

# ── Focus mode (blocks all keybinds, screen off) ──
bind = $mod, F10, exec, hyprctl dispatch dpms off
bind = $mod, F10, submap, focusmode

submap = focusmode
bind = $mod, Escape, exec, hyprctl dispatch dpms on
bind = $mod, Escape, submap, reset
submap = reset

bind = $mod, W, exec, ~/.config/hypr/scripts/wallpaper.sh --pick

bind = $mod, R, exec, ~/.config/hypr/scripts/reload.sh

# ─────────────────────────────────────────────────────────────────────
# End of hyprland.conf