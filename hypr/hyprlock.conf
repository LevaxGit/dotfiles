general {
    disable_loading_bar = false
    hide_cursor         = true
    grace               = 0
    no_fade_in          = false
}

background {
    monitor =
    path    = screenshot
    blur_passes = 3
    blur_size   = 7
    brightness  = 0.7
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size         = 0.33
    dots_spacing      = 0.15
    dots_center       = true
    outer_color       = rgba(89b4faee)
    inner_color       = rgba(1e1e2eee)
    font_color        = rgb(cdd6f4)
    fade_on_empty     = true
    placeholder_text  = <i>Password...</i>
    hide_input        = false
    check_color       = rgba(a6e3a1ee)
    fail_color        = rgba(f38ba8ee)
    fail_text         = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position          = 0, -120
    halign            = center
    valign            = center
}

label {
    monitor =
    text     = cmd[update:1000] echo "$(date +"%H:%M")"
    color    = rgba(cdd6f4ff)
    font_size = 72
    font_family = JetBrainsMono NF
    position  = 0, 80
    halign    = center
    valign    = center
}

label {
    monitor =
    text    = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color   = rgba(a6adc8ff)
    font_size = 18
    font_family = JetBrainsMono NF
    position  = 0, -20
    halign    = center
    valign    = center
}
